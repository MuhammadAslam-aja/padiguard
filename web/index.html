<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hama_padi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0f19; /* Very dark blue/slate space theme background */
      margin: 0;
      overflow: hidden;
    }
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  
  <script>
    // Unregister any old service worker to ensure fresh app load
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Modern JS Canvas Particle Network Animation
    (function() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      
      let width = canvas.width = window.innerWidth;
      let height = canvas.height = window.innerHeight;
      
      const particles = [];
      const properties = {
        bgColor: 'rgba(11, 15, 25, 1)',
        particleColor: 'rgba(129, 140, 248, 0.4)', // Soft indigo/electric blue
        particleRadius: 2.5,
        particleCount: 75,
        maxVelocity: 0.6,
        lineLength: 140,
        linkColor: 'rgba(129, 140, 248, 0.08)'
      };
      
      window.addEventListener('resize', function() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });
      
      class Particle {
        constructor() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.velocityX = (Math.random() * (properties.maxVelocity * 2)) - properties.maxVelocity;
          this.velocityY = (Math.random() * (properties.maxVelocity * 2)) - properties.maxVelocity;
        }
        
        position() {
          if (this.x + this.velocityX > width || this.x + this.velocityX < 0) {
            this.velocityX = -this.velocityX;
          }
          if (this.y + this.velocityY > height || this.y + this.velocityY < 0) {
            this.velocityY = -this.velocityY;
          }
          this.x += this.velocityX;
          this.y += this.velocityY;
        }
        
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, properties.particleRadius, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fillStyle = properties.particleColor;
          ctx.fill();
        }
      }
      
      function drawLines() {
        let x1, y1, x2, y2, length, opacity;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            x1 = particles[i].x;
            y1 = particles[i].y;
            x2 = particles[j].x;
            y2 = particles[j].y;
            
            length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
            if (length < properties.lineLength) {
              opacity = 1 - (length / properties.lineLength);
              ctx.lineWidth = '0.7';
              ctx.strokeStyle = `rgba(129, 140, 248, ${opacity * 0.12})`;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.closePath();
              ctx.stroke();
            }
          }
        }
      }
      
      function init() {
        for (let i = 0; i < properties.particleCount; i++) {
          particles.push(new Particle());
        }
        loop();
      }
      
      function loop() {
        ctx.clearRect(0, 0, width, height);
        
        // Draw slowly moving mesh background
        drawLines();
        
        for (let i = 0; i < particles.length; i++) {
          particles[i].position();
          particles[i].draw();
        }
        requestAnimationFrame(loop);
      }
      
      init();
    })();
  </script>

  <!--

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
